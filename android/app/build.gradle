apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore/signing.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 诊断用开关：-Pxinshi.versionCode=1001 覆盖版本号；-Pxinshi.noMinify 关闭 R8 以对比排查；
// -Pxinshi.debuggable 让 release 包带 WebView 调试（仅本地排查用，发布包绝不能带）。
def xinshiVersionCode = project.hasProperty('xinshi.versionCode')
    ? project.property('xinshi.versionCode').toString().toInteger()
    : 1204
def xinshiVersionName = project.hasProperty('xinshi.versionName')
    ? project.property('xinshi.versionName').toString()
    : "1.2.4"
def xinshiMinify = !project.hasProperty('xinshi.noMinify')
def xinshiDebuggable = project.hasProperty('xinshi.debuggable')
// 仅排查 R8：保留压缩，同时打开 WebView CDP；发布不能使用。
def xinshiWebViewDebug = project.hasProperty('xinshi.webviewDebug')
def xinshiDiag = project.hasProperty('xinshi.diag')

android {
    namespace "com.xinshi.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.xinshi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode xinshiVersionCode
        versionName xinshiVersionName
        buildConfigField "boolean", "XINSHI_DIAG", xinshiDiag ? "true" : "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled xinshiMinify && !xinshiDebuggable
            shrinkResources xinshiMinify && !xinshiDebuggable
            if (xinshiDebuggable || xinshiWebViewDebug) {
                debuggable true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// 发布签名守卫：只在真正产出 release 包时校验（debug 构建、单元测试、Android Studio 同步不受影响）。
// 缺少 signing.properties 时明确失败，避免静默产出不可安装 / 不可上架的 unsigned release 包。
def releaseArtifactTaskNames = [
    'assembleRelease',
    'bundleRelease',
    'installRelease',
    'packageRelease',
    'packageReleaseBundle',
] as Set
def signingPropertiesFile = keystorePropertiesFile
def appProject = project

gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { task ->
        task.project == appProject && releaseArtifactTaskNames.contains(task.name)
    }
    if (releaseTask != null && !signingPropertiesFile.exists()) {
        throw new GradleException(
            "缺少发布签名配置：${signingPropertiesFile} 不存在。\n" +
            "请在 android/keystore/signing.properties 配置 storeFile / storePassword / keyAlias / keyPassword，" +
            "然后重新执行 ${releaseTask.name}；不要分发未签名的 release 产物。"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

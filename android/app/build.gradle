apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore/signing.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// 诊断用开关：-Pxinshi.versionCode=1001 覆盖版本号；-Pxinshi.noMinify 关闭 R8 以对比排查；
// -Pxinshi.debuggable 让 release 包带 WebView 调试（仅本地排查用，发布包绝不能带）。
// -Pxinshi.diag 让 release 包把诊断写到公共 Download（正式包禁止，见下方 release 守卫）。
def xinshiVersionCode = project.hasProperty('xinshi.versionCode')
    ? project.property('xinshi.versionCode').toString().toInteger()
    : 1205
def xinshiVersionName = project.hasProperty('xinshi.versionName')
    ? project.property('xinshi.versionName').toString()
    : "1.2.5"
def xinshiMinify = !project.hasProperty('xinshi.noMinify')
def xinshiDebuggable = project.hasProperty('xinshi.debuggable')
// 仅排查 R8：保留压缩，同时打开 WebView CDP；发布不能使用。
def xinshiWebViewDebug = project.hasProperty('xinshi.webviewDebug')
def xinshiDiag = project.hasProperty('xinshi.diag')

android {
    namespace "com.xinshi.app"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.xinshi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode xinshiVersionCode
        versionName xinshiVersionName
        buildConfigField "boolean", "XINSHI_DIAG", xinshiDiag ? "true" : "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled xinshiMinify && !xinshiDebuggable
            shrinkResources xinshiMinify && !xinshiDebuggable
            if (xinshiDebuggable || xinshiWebViewDebug) {
                debuggable true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// 发布签名守卫：只在真正产出 release 包时校验（debug 构建、单元测试、Android Studio 同步不受影响）。
// 缺少 signing.properties 时明确失败，避免静默产出不可安装 / 不可上架的 unsigned release 包。
def releaseArtifactTaskNames = [
    'assembleRelease',
    'bundleRelease',
    'installRelease',
    'packageRelease',
    'packageReleaseBundle',
] as Set
def signingPropertiesFile = keystorePropertiesFile
def appProject = project

gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { task ->
        task.project == appProject && releaseArtifactTaskNames.contains(task.name)
    }
    if (releaseTask == null) {
        return
    }
    // 拒绝可调试 release：-Pxinshi.debuggable / -Pxinshi.webviewDebug 会让正式签名的 release
    // 带上 debuggable=true（run-as 可读整本账、WebView CDP 开启），只能本地排查，绝不可分发。
    if (xinshiDebuggable || xinshiWebViewDebug) {
        def flags = []
        if (xinshiDebuggable) flags.add('-Pxinshi.debuggable')
        if (xinshiWebViewDebug) flags.add('-Pxinshi.webviewDebug')
        throw new GradleException(
            "拒绝构建可调试 release：检测到 ${flags.join(' / ')}。\n" +
            "这些开关会让 release 包 debuggable=true（run-as 可读账本、WebView 远程调试开启），" +
            "正式包禁止使用；本地排查请改用 debug 构建，或移除参数后重新执行 ${releaseTask.name}。"
        )
    }
    // 拒绝诊断 release：-Pxinshi.diag 会把 BuildConfig.XINSHI_DIAG 置为 true，
    // 正式包每次启动 / 回前台 / 页面加载 / 崩溃都会把崩溃栈与设备信息写入公共 Download/Xinshi/xinshi-diag.txt
    // （Android 5–9 写入应用私有 Android/data 目录，其余版本在公共 Download），属隐私泄露。
    // 本地排查需要诊断请改用 debug 构建（不受本守卫影响）。
    if (xinshiDiag) {
        throw new GradleException(
            "拒绝构建诊断 release：检测到 -Pxinshi.diag。\n" +
            "该开关会让正式包把崩溃栈 / 设备信息写到公共 Download/Xinshi/xinshi-diag.txt，" +
            "属隐私泄露，正式包禁止使用；本地排查请改用 debug 构建，或移除参数后重新执行 ${releaseTask.name}。"
        )
    }
    if (!signingPropertiesFile.exists()) {
        throw new GradleException(
            "缺少发布签名配置：${signingPropertiesFile} 不存在。\n" +
            "请在 android/keystore/signing.properties 配置 storeFile / storePassword / keyAlias / keyPassword，" +
            "然后重新执行 ${releaseTask.name}；不要分发未签名的 release 产物。"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// 本项目不使用 Firebase / 推送，已移除 google-services 探测与插件应用（AND-20）。
// 若日后接入 Firebase，请同时恢复本块并清理 android/build.gradle 的 classpath 与 .gitignore 例外。
